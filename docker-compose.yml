services:
  test:
    build: .
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
    command: pytest tests/ -v --tb=short

  dev:
    build: .
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
    command: bash
    stdin_open: true
    tty: true
